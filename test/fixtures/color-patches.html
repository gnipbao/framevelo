<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; }
</style>
</head>
<body>
<!-- Four flat patches, for checking the encoder's RGB to YUV matrix. -->
<canvas id="patches" width="256" height="64"></canvas>
<script>
  const g = document.getElementById("patches").getContext("2d");
  ["rgb(255,0,0)", "rgb(0,255,0)", "rgb(0,0,255)", "rgb(128,128,128)"].forEach((color, i) => {
    g.fillStyle = color;
    g.fillRect(i * 64, 0, 64, 64);
  });
  window.__framevelo = { duration: 0.1, fps: 30, seek: () => {} };
</script>
</body>
</html>
