<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=360" />
    <title>Callback-driven state</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #10141c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #10141c; }
      #box { position: absolute; left: 40px; top: 130px; width: 100px; height: 100px; background: #f5a623; }
    </style>
  </head>
  <body>
    <!-- The box moves only through an onUpdate callback, from 1.5 s, the way many compositions drive
         a camera. Verification samples later in the film must not leave it moved in the first frames.
         The tone (written by the test) peaks near 0 dBFS, so the mix needs the true-peak step. -->
    <div id="root" data-composition-id="main" data-start="0" data-width="640" data-height="360" data-duration="6">
      <div id="box"></div>
      <audio id="tone" src="tone.wav" data-start="0" data-duration="6" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const box = document.getElementById("box");
      const st = { x: 0 };
      const apply = () => { box.style.transform = `translateX(${st.x}px)`; };
      apply();
      // A camera-style chain: every key is a fromTo on the same state object.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { x: 0 }, { x: 200, duration: 1, ease: "none", onUpdate: apply, immediateRender: false }, 1.5);
      tl.fromTo(st, { x: 200 }, { x: 400, duration: 1, ease: "none", onUpdate: apply, immediateRender: false }, 3.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
