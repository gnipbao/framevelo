name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
      - name: The built MCP server answers over stdio
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2) \
            | node dist/cli.js mcp \
            | node -e '
              const lines = require("fs").readFileSync(0, "utf8").trim().split("\n").map((l) => JSON.parse(l));
              const tools = lines.find((m) => m.id === 2).result.tools.map((t) => t.name);
              if (tools.join() !== "render,doctor,install_browser") throw new Error(`unexpected tools: ${tools}`);
              console.log(lines[0].result.serverInfo, tools);
            '

  integration:
    name: Integration (macOS, Chrome, FFmpeg)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: brew install ffmpeg
      - run: npm ci
      - name: Install chrome-headless-shell
        run: node src/cli.ts browser install
      - name: Doctor
        run: node src/cli.ts doctor || true
      - name: Integration tests
        run: npm run test:integration
