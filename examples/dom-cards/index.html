<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>DOM cards</title>
  <style>
    html, body { margin: 0; background: #0b0d12; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: -apple-system, Helvetica, sans-serif;
            background: radial-gradient(circle at 30% 20%, #1d2a4a, #0b0d12 70%); }
    .card { position: absolute; left: 0; top: 0; width: 200px; height: 120px; border-radius: 18px; color: #fff; padding: 14px;
            box-sizing: border-box; font-size: 20px; font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); }
    h1 { position: absolute; left: 0; right: 0; top: 440px; margin: 0; text-align: center; color: #fff; font-size: 120px; letter-spacing: -2px; }
    h1 span { display: inline-block; }
    p { position: absolute; left: 0; right: 0; top: 600px; margin: 0; text-align: center; color: #9fb3ff; font-size: 40px; }
  </style>
</head>
<body>
  <div id="root">
    <h1 id="title"></h1>
    <p id="clock"></p>
  </div>
  <script>
    const root = document.getElementById("root");
    const hues = [210, 260, 320, 20, 160];
    const cards = Array.from({ length: 48 }, (_, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.background = `linear-gradient(135deg, hsl(${hues[i % 5]} 70% 55%), hsl(${hues[(i + 2) % 5]} 70% 35%))`;
      card.textContent = `Frame ${String(i).padStart(2, "0")}`;
      root.insertBefore(card, root.firstChild);
      return card;
    });
    const letters = "FrameVelo".split("").map((ch) => {
      const span = document.createElement("span");
      span.textContent = ch;
      document.getElementById("title").appendChild(span);
      return span;
    });
    const clock = document.getElementById("clock");
    const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

    // Seek is a pure function of time; FrameVelo calls it once per frame.
    function seek(t) {
      cards.forEach((card, i) => {
        const k = ease((t - 0.04 * i) / 1.2);
        const x = 60 + (i % 12) * 150 + 24 * Math.sin(t * 1.3 + i);
        const y = 60 + Math.floor(i / 12) * 240 + (1 - k) * 700;
        card.style.transform = `translate(${x}px, ${y}px) rotate(${(1 - k) * 35 + 5 * Math.sin(t + i)}deg)`;
        card.style.opacity = String(0.3 + 0.7 * k);
      });
      letters.forEach((span, i) => {
        const k = ease((t - 0.8 - 0.06 * i) / 0.6);
        span.style.transform = `translateY(${(1 - k) * 90}px)`;
        span.style.opacity = String(k);
      });
      clock.textContent = `t = ${t.toFixed(2)} s`;
    }

    window.__framevelo = { duration: 5, seek };
    seek(0);
  </script>
</body>
</html>
