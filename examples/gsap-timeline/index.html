<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>GSAP timeline (HyperFrames style)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #0b0f14; color: white; font-family: -apple-system, Helvetica, sans-serif; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(160deg, #101827, #0b0f14); }
    .clip { position: absolute; inset: 0; display: grid; place-items: center; }
    h1 { margin: 0; font-size: 140px; letter-spacing: -3px; }
    .bar { position: absolute; left: 160px; bottom: 140px; width: 1600px; height: 16px; border-radius: 8px;
           background: linear-gradient(90deg, #6cf, #c6f); transform-origin: left center; }
    .dot { position: absolute; left: 0; top: 200px; width: 90px; height: 90px; border-radius: 50%; background: #ffcc66;
           box-shadow: 0 0 60px rgba(255, 204, 102, 0.6); }
  </style>
</head>
<body>
  <!-- HyperFrames standalone composition: the root's data-duration is the render length. -->
  <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="4">
    <section class="clip" data-start="0" data-duration="4">
      <h1 id="title">Speed the render.</h1>
      <div class="bar" id="bar"></div>
      <div class="dot" id="dot"></div>
    </section>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#title", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2)
      .fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 3, ease: "none" }, 0.5)
      .fromTo("#dot", { x: 160 }, { x: 1670, duration: 3.2, ease: "sine.inOut" }, 0.4);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
