<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>FrameVelo × HyperFrames</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: #fff; font-family: Helvetica, Arial, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(160deg, #111a2e, #0b0f14 70%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="stats"
        data-composition-id="stats"
        data-composition-src="compositions/stats.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <audio id="bed" src="assets/bed.m4a" data-start="0" data-duration="8" data-track-index="2" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
