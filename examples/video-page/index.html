<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Video on a plain page</title>
  <style>
    html, body { margin: 0; background: #0b0d12; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: -apple-system, Helvetica, sans-serif;
            background: linear-gradient(160deg, #111a2e, #0b0d12 70%); color: #fff; }
    #frame { position: absolute; left: 160px; top: 200px; width: 960px; height: 540px; border-radius: 28px; overflow: hidden;
             box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
    #clip { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { position: absolute; left: 1220px; top: 360px; margin: 0; font-size: 84px; line-height: 1.05; }
    p { position: absolute; left: 1224px; top: 560px; margin: 0; font-size: 36px; color: #9fb3ff; }
  </style>
</head>
<body>
  <div id="root">
    <!-- FrameVelo keeps this video on the composition clock: media time = t - data-start. -->
    <div id="frame"><video id="clip" src="assets/clip.mp4" muted playsinline preload="auto" data-start="0.5"></video></div>
    <h1 id="title">Footage,<br />frame-exact.</h1>
    <p id="clock"></p>
  </div>
  <script>
    const frame = document.getElementById("frame");
    const clock = document.getElementById("clock");
    window.__framevelo = {
      duration: 4,
      seek(t) {
        frame.style.transform = `translateX(${Math.max(0, 1 - t) * -80}px)`;
        frame.style.opacity = String(Math.min(1, t * 2));
        clock.textContent = `t = ${t.toFixed(2)} s`;
      },
    };
  </script>
</body>
</html>
