<!doctype html>
<!-- FrameVelo cover. A seekable composition: `framevelo render docs/assets/cover.html` renders a
     4-second teaser; `node scripts/cover.ts` screenshots its last frame as docs/assets/cover.png. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=640" />
<title>FrameVelo</title>
<style>
  :root {
    --bg: #06080e;
    --ink: #f4f6fb;
    --muted: #8d97b0;
    --cyan: #5ad1ff;
    --violet: #a17bff;
    --pink: #ff7ac6;
  }
  html, body { margin: 0; background: var(--bg); }
  #cover {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background:
      radial-gradient(900px 520px at 78% 50%, rgba(161, 123, 255, 0.16), transparent 70%),
      radial-gradient(700px 420px at 18% 30%, rgba(90, 209, 255, 0.10), transparent 70%),
      var(--bg);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  #grid {
    position: absolute; inset: 0; opacity: 0.35;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(800px 500px at 60% 50%, #000 30%, transparent 80%);
  }
  .streak {
    position: absolute; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(90, 209, 255, 0.55), rgba(161, 123, 255, 0.9));
  }

  /* Film strip: frames of one motion, accelerating to the right. */
  #strip {
    position: absolute; left: 700px; top: 150px; width: 760px; height: 340px;
    perspective: 1100px;
  }
  #reel {
    position: absolute; inset: 0; transform-origin: 0 50%;
    transform: rotateY(-24deg) rotateZ(-3deg);
  }
  .frame {
    position: absolute; top: 40px; width: 150px; height: 230px; border-radius: 14px;
    background: linear-gradient(160deg, #141a2b, #0b0f1a);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; left: 10px; right: 10px; height: 8px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 10px, transparent 10px 20px);
  }
  .frame::before { top: 10px; }
  .frame::after { bottom: 10px; }
  .ball {
    position: absolute; top: 96px; width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, var(--cyan) 45%, var(--violet));
    box-shadow: 0 0 24px rgba(90, 209, 255, 0.55);
  }
  .trail {
    position: absolute; top: 108px; height: 14px; border-radius: 7px;
    background: linear-gradient(90deg, transparent, rgba(90, 209, 255, 0.5));
  }
  .tick { position: absolute; bottom: 26px; left: 14px; font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }

  /* Text */
  #text { position: absolute; left: 84px; top: 158px; width: 600px; }
  #mark { display: flex; align-items: center; gap: 22px; }
  #logo { width: 76px; height: 76px; }
  h1 { margin: 0; font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -3.5px; }
  h1 span { background: linear-gradient(90deg, var(--cyan), var(--violet) 60%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #tagline { margin: 34px 0 0; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.8px; white-space: nowrap; }
  #sub { margin: 14px 0 0; width: 540px; font-size: 21px; line-height: 1.45; color: var(--muted); }
  #chips { display: flex; gap: 8px; margin-top: 32px; }
  .chip {
    font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: #cfd6ea;
    padding: 7px 11px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10);
  }
</style>
</head>
<body>
<div id="cover">
  <div id="grid"></div>
  <div id="streaks"></div>
  <div id="strip"><div id="reel"></div></div>
  <div id="text">
    <div id="mark">
      <svg id="logo" viewBox="0 0 76 76" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5ad1ff" /><stop offset="0.6" stop-color="#a17bff" /><stop offset="1" stop-color="#ff7ac6" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="70" height="70" rx="18" fill="none" stroke="url(#g)" stroke-width="5" />
        <path d="M30 22 L54 38 L30 54 Z" fill="url(#g)" />
        <path d="M14 30 H24 M10 38 H24 M14 46 H24" stroke="url(#g)" stroke-width="4" stroke-linecap="round" />
      </svg>
      <h1>Frame<span>Velo</span></h1>
    </div>
    <p id="tagline">Code the motion. Speed the render.</p>
    <p id="sub">HTML, GSAP and canvas videos to MP4. Frames stay on the GPU and go straight to the hardware encoder.</p>
    <div id="chips">
      <span class="chip">drawElementImage</span>
      <span class="chip">WebCodecs</span>
      <span class="chip">VideoToolbox</span>
      <span class="chip">HyperFrames</span>
      <span class="chip">MCP</span>
    </div>
  </div>
</div>
<script>
  const FRAMES = 6;
  const DURATION = 4;
  const reel = document.getElementById("reel");
  const streaks = document.getElementById("streaks");
  const frames = [];
  for (let i = 0; i < FRAMES; i++) {
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.innerHTML = '<div class="trail"></div><div class="ball"></div><div class="tick"></div>';
    reel.appendChild(frame);
    frames.push(frame);
  }
  const lines = [
    { top: 118, left: 520, width: 300 },
    { top: 202, left: 600, width: 420 },
    { top: 470, left: 560, width: 360 },
    { top: 540, left: 700, width: 260 },
    { top: 84, left: 820, width: 220 },
  ].map((spec) => {
    const el = document.createElement("div");
    el.className = "streak";
    el.style.top = `${spec.top}px`;
    streaks.appendChild(el);
    return { el, ...spec };
  });
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

  // Every element is a function of t, so the cover renders as a video too.
  function seek(t) {
    frames.forEach((frame, i) => {
      const k = ease((t - 0.15 * i) / 0.9);
      // Frames fan out to the right, spaced wider as the motion speeds up.
      const x = 40 + i * 118 + i * i * 6;
      frame.style.transform = `translateX(${x + (1 - k) * 140}px)`;
      frame.style.opacity = String(k * (0.45 + 0.11 * i));
      // The ball crosses its frame faster in later frames; its trail grows with the speed.
      const progress = clamp((i + 1) / FRAMES);
      const ballX = 14 + progress * 84;
      frame.querySelector(".ball").style.left = `${ballX}px`;
      const trail = frame.querySelector(".trail");
      trail.style.left = `${Math.max(6, ballX - 12 - i * 14)}px`;
      trail.style.width = `${12 + i * 14}px`;
      frame.querySelector(".tick").textContent = `f ${String((i + 1) * 12).padStart(3, "0")}`;
    });
    lines.forEach((line, i) => {
      const k = ease((t - 0.5 - 0.12 * i) / 1.2);
      line.el.style.left = `${line.left + (1 - k) * -200}px`;
      line.el.style.width = `${line.width * k}px`;
      line.el.style.opacity = String(0.8 * k);
    });
    const text = ease(t / 0.8);
    document.getElementById("text").style.opacity = String(text);
    document.getElementById("text").style.transform = `translateY(${(1 - text) * 16}px)`;
  }
  seek(DURATION);
  window.__framevelo = { duration: DURATION, fps: 30, seek };
</script>
</body>
</html>
