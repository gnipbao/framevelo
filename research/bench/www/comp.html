<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0b0d12; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
          background: radial-gradient(circle at 30% 20%, #1d2a4a, #0b0d12 70%); font-family: -apple-system, Helvetica, sans-serif; }
  .card { position: absolute; width: 180px; height: 110px; border-radius: 16px; color: #fff;
          box-shadow: 0 12px 30px rgba(0,0,0,.45); padding: 12px; box-sizing: border-box; font-size: 18px; font-weight: 600; }
  .blob { position: absolute; width: 520px; height: 520px; border-radius: 50%; opacity: .55; }
  #title { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 120px; font-weight: 800; color: #fff; letter-spacing: -2px; }
  #title span { display: inline-block; }
  #sub { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 40px; color: #9fb3ff; }
  #bar { position: absolute; left: 160px; top: 980px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #6cf, #c6f); }
</style></head>
<body>
<script>
  const DE = new URLSearchParams(location.search).get('mode') === 'de';
  const W = 1920, H = 1080;
  const wrap = DE ? document.createElement('canvas') : document.body;
  if (DE) { wrap.id = 'cap'; wrap.width = W; wrap.height = H; wrap.setAttribute('layoutsubtree', ''); wrap.style.cssText = 'display:block;width:1920px;height:1080px'; document.body.appendChild(wrap); }
  const root = document.createElement('div'); root.id = 'root'; wrap.appendChild(root);
  if (new URLSearchParams(location.search).has('lite')) { const st = document.createElement('style'); st.textContent = '.card{box-shadow:none!important}'; document.head.appendChild(st); }
  const hues = [210, 260, 320, 20, 160];
  const blobs = hues.slice(0, 3).map((h, i) => { const b = document.createElement('div'); b.className = 'blob';
    b.style.background = `radial-gradient(circle, hsl(${h} 90% 60%), transparent 70%)`; root.appendChild(b); return b; });
  const cards = [];
  for (let i = 0; i < 80; i++) { const c = document.createElement('div'); c.className = 'card';
    c.style.background = `linear-gradient(135deg, hsl(${hues[i % 5]} 70% 55%), hsl(${hues[(i + 2) % 5]} 70% 35%))`;
    c.textContent = `Node ${String(i).padStart(2, '0')}`; root.appendChild(c); cards.push(c); }
  const title = document.createElement('div'); title.id = 'title';
  const letters = 'FrameVelo Render'.split('').map((ch) => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; title.appendChild(s); return s; });
  root.appendChild(title);
  const sub = document.createElement('div'); sub.id = 'sub'; root.appendChild(sub);
  const bar = document.createElement('div'); bar.id = 'bar'; root.appendChild(bar);
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  // Pure function of time, like a paused GSAP timeline seek.
  window.__seek = (t) => {
    blobs.forEach((b, i) => { b.style.transform = `translate(${300 + 500 * i + 200 * Math.sin(t * 0.7 + i)}px, ${120 + 180 * Math.cos(t * 0.5 + i * 2)}px)`; });
    cards.forEach((c, i) => {
      const col = i % 16, row = (i / 16) | 0, k = ease((t - 0.03 * i) / 1.2);
      const x = 40 + col * 118 + 30 * Math.sin(t * 1.3 + i), y = 40 + row * 200 + (1 - k) * 600 + 20 * Math.cos(t * 1.1 + i);
      c.style.transform = `translate(${x}px, ${y}px) rotate(${(1 - k) * 40 + 6 * Math.sin(t + i)}deg) scale(${0.6 + 0.4 * k})`;
      c.style.opacity = String(0.25 + 0.75 * k);
    });
    letters.forEach((s, i) => { const k = ease((t - 1 - 0.05 * i) / 0.6); s.style.transform = `translateY(${(1 - k) * 80}px)`; s.style.opacity = String(k); });
    sub.textContent = `t = ${t.toFixed(3)}s · frame ${Math.round(t * 30)}`;
    bar.style.width = `${1600 * Math.min(1, t / 10)}px`;
  };
  window.__seek(0);
</script>
<script src="capture.js"></script>
</body></html>
